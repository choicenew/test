name: Caxhed Flutter Build, Sign and Release

on:
  workflow_dispatch:
  #push:
  #  branches:
   #   - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
                
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0' 
          channel: 'stable'
          cache: true 
          cache-key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml') }}
          
      - run: flutter pub get
      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools



      # Cache build artifacts
      - name: Cache Build Artifacts
        uses: actions/cache@v3
        with:
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/apk/release/*.apk
          key: ${{ runner.os }}-flutter-build-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-build-

      # Build and Sign AAB and APKs using Flutter's built-in signing (with caching)
      - name: Build and Sign AAB and APKs
        if: steps.cache-build-artifacts.outputs.cache-hit != 'true' # Only build if cache miss
        run: |
          flutter build appbundle -v 
          flutter build apk --split-per-abi

      # Upload signed AAB and APKs as artifacts
      - name: Upload Signed Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: signed-release-artifacts
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/apk/release/*.apk

      - name: Extract pubspec version
        run: |
          echo "PUBSPEC_VERSION=$(grep -oP 'version:\s*\K[^+]+(?=\+)' pubspec.yaml)" >> $GITHUB_ENV

