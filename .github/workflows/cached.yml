name: Export D2Dewarp ONNX Model (CVPR 2026)
on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      custom_weight_url:
        description: 'Direct download URL for model_weight.pt (Leave empty to fetch from Google Drive)'
        required: false
        default: ''
        type: string
permissions:
  contents: write
jobs:
  export_and_commit:
    name: Export ONNX and Commit Directly to Repo
    if: "!contains(github.event.head_commit.message, 'feat(dewarp): export and add D2Dewarp')"
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 2. Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 3. Install PyTorch and Export Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install onnx onnxruntime gdown thop opencv-python Pillow numpy
      - name: 4. Ensure D2Dewarp Source Code
        run: |
          if [ -d "REF/scan/D2Dewarp" ]; then
            echo "[*] Copying local D2Dewarp code..."
            cp -r REF/scan/D2Dewarp/* .
          elif [ ! -f "predict.py" ]; then
            echo "[*] Cloning official D2Dewarp repository..."
            git clone --depth 1 https://github.com/xiaomore/D2Dewarp.git d2dewarp_src
            cp -r d2dewarp_src/* .
          fi
      - name: 5. Download Pre-trained Weights (model_weight.pt)
        run: |
          CUSTOM_URL="${{ github.event.inputs.custom_weight_url }}"
          if [ -n "$CUSTOM_URL" ]; then
            echo "[*] Downloading weights from: $CUSTOM_URL"
            curl -L -o model_weight.pt "$CUSTOM_URL"
