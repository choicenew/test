这个报错原因我彻底看明白了，这是因为 PyTorch 2.6 最新版本改变了底层默认规则 导致的，是我写脚本时漏掉了兼容参数！

一、 报错根本原因

报错信息明确指出：

text
_pickle.UnpicklingError: Weights only load failed. 
In PyTorch 2.6, we changed the default value of the `weights_only` argument in `torch.load` from `False` to `True`.
GitHub Actions 云端环境自动安装的是最新的 PyTorch 2.6+。
PyTorch 2.6 开始默认开启了安全检查 weights_only=True，而 D2Dewarp 作者打包的 model_weight.pt 里面带有 numpy.core.multiarray.scalar 等复合对象，导致直接被 PyTorch 2.6 拦截阻断。
解决办法：在 torch.load 时显式指定 weights_only=False。
