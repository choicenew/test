name: Export D2Dewarp ONNX Model (CVPR 2026)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export_onnx:
    name: Convert D2Dewarp to ONNX
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install PyTorch and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install onnx onnxruntime gdown thop opencv-python Pillow numpy

      - name: 4. Ensure D2Dewarp Codebase
        run: |
          if [ -d "REF/scan/D2Dewarp" ]; then
            echo "[*] Using local REF/scan/D2Dewarp codebase..."
            cp -r REF/scan/D2Dewarp/* .
          elif [ ! -d "networks" ]; then
            echo "[*] Cloning official D2Dewarp repository..."
            git clone --depth 1 https://github.com/xiaomore/D2Dewarp.git d2dewarp_src
            cp -r d2dewarp_src/* .
          fi

      - name: 5. Download Model Weights
        run: |
          if [ -f "model_weight.pt" ]; then
            echo "[*] model_weight.pt already exists in workspace root."
          else
            echo "[*] Downloading weights from Google Drive folder..."
            python -m gdown --folder "https://drive.google.com/drive/folders/1wVOeEqkUvTKYDNIyrZRRwaK781lJulM6" -O gdrive_weights || \
            python -m gdown --folder "https://drive.google.com/drive/folders/1gv0lLaZWlUt1tX7EJDaVhtFhmV-ewQox" -O gdrive_weights || true

            PT_FILE=$(find . -name "*.pt" -o -name "*.pth" | head -n 1)
            if [ -n "$PT_FILE" ] && [ "$PT_FILE" != "./model_weight.pt" ]; then
              cp "$PT_FILE" ./model_weight.pt
              echo "[✓] Prepared $PT_FILE as ./model_weight.pt"
            fi
          fi

          if [ ! -f "model_weight.pt" ]; then
            echo "::error::model_weight.pt could not be located."
            exit 1
          fi
          ls -lh model_weight.pt

      - name: 6. Run ONNX Conversion
        run: |
          cat << 'EOF' > export_onnx.py
          import argparse, os, sys
          import numpy as np
          sys.path.insert(0, os.path.abspath("."))
          sys.path.insert(0, os.path.abspath("networks"))

          import torch
          import torch.nn as nn
          import onnx
          import onnxruntime as ort

          try:
              from networks.d2dewarp_model import D2DewarpModel
          except ImportError:
              from d2dewarp_model import D2DewarpModel

          class D2DewarpInferenceWrapper(nn.Module):
              def __init__(self, base_model):
                  super().__init__()
                  self.base_model = base_model
              def forward(self, x):
                  pred_h_lst, pred_v_lst, bm_up = self.base_model(x)
                  return bm_up, pred_h_lst[-1], pred_v_lst[-1]

          def export():
              parser = argparse.ArgumentParser()
              parser.add_argument('--weight_path', default='model_weight.pt')
              parser.add_argument('--output_path', default='d2dewarp.onnx')
              parser.add_argument('--input_size', type=int, default=448)
              parser.add_argument('--d_model', type=int, default=448)
              parser.add_argument('--opset', type=int, default=17)
              args = parser.parse_args()

              print(f"[*] Loading PyTorch weights from {args.weight_path}...")
              try:
                  ckpt = torch.load(args.weight_path, map_location='cpu', weights_only=False)
              except Exception:
                  try:
                      torch.serialization.add_safe_globals([np.core.multiarray.scalar])
                  except Exception:
                      pass
                  ckpt = torch.load(args.weight_path, map_location='cpu')

              state_dict = ckpt.get('state_dict', ckpt)
              cleaned = {k.replace('module.', ''): v for k, v in state_dict.items()}

              base_model = D2DewarpModel(img_size=args.input_size, in_chans=4, hv_out_chans=1, d_model=args.d_model)
              base_model.load_state_dict(cleaned, strict=True)
              base_model.eval()

              wrapper = D2DewarpInferenceWrapper(base_model)
              dummy_input = torch.randn(1, 4, args.input_size, args.input_size, dtype=torch.float32)

              print(f"[*] Exporting ONNX to {args.output_path}...")
              torch.onnx.export(
                  wrapper, dummy_input, args.output_path,
                  export_params=True, opset_version=args.opset, do_constant_folding=True,
                  input_names=['input_rgb_edge'], output_names=['backward_mapping', 'pred_h', 'pred_v'],
                  dynamic_axes={'input_rgb_edge': {0: 'batch'}, 'backward_mapping': {0: 'batch'}}
              )
              print(f"[✓] Successfully exported {args.output_path}")

              print(f"[*] Validating ONNX with onnxruntime...")
              onnx.checker.check_model(onnx.load(args.output_path))
              sess = ort.InferenceSession(args.output_path, providers=['CPUExecutionProvider'])
              res = sess.run(None, {'input_rgb_edge': dummy_input.numpy()})
              print(f"[✓] Validation passed! backward_mapping shape: {res[0].shape}")

          if __name__ == '__main__':
              export()
          EOF

          python export_onnx.py --weight_path model_weight.pt --output_path d2dewarp.onnx
          ls -lh d2dewarp.onnx

      - name: 7. Upload ONNX as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2dewarp-cvpr2026-onnx
          path: d2dewarp.onnx
          retention-days: 90

      - name: 8. Optional Commit and Push to Repository
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          TARGET_DIR="packages/dewarp/pyro_dewarp_d2dewarp_ffi/test/assets"
          mkdir -p "$TARGET_DIR"
          cp d2dewarp.onnx "$TARGET_DIR/d2dewarp.onnx"

          git add "$TARGET_DIR/d2dewarp.onnx"
          if ! git diff --staged --quiet; then
            git commit -m "feat(dewarp): export and add D2Dewarp CVPR 2026 ONNX model weights [skip ci]"
            git push
            echo "[✓] Successfully committed and pushed d2dewarp.onnx to repository!"
          fi

      - name: 9. Optional GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: d2dewarp-cvpr2026-v1.0.0
          name: "D2Dewarp ONNX Release (CVPR 2026 SOTA)"
          files: d2dewarp.onnx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
