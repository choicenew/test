name: Export D2Dewarp ONNX

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export_onnx:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install onnx onnxruntime onnxscript gdown thop opencv-python Pillow numpy

      - name: 4. Ensure D2Dewarp Source Code
        run: |
          if [ ! -d "networks" ]; then
            git clone --depth 1 https://github.com/xiaomore/D2Dewarp.git d2dewarp_src
            cp -r d2dewarp_src/* .
          fi

      - name: 5. Ensure Weights
        run: |
          if [ ! -f "model_weight.pt" ]; then
            echo "[*] Downloading weights from Google Drive folder..."
            python -m gdown --folder "https://drive.google.com/drive/folders/1wVOeEqkUvTKYDNIyrZRRwaK781lJulM6" -O gdrive_weights || true
            PT_FILE=$(find . -name "*.pt" -o -name "*.pth" | head -n 1)
            if [ -n "$PT_FILE" ] && [ "$PT_FILE" != "./model_weight.pt" ]; then
              cp "$PT_FILE" ./model_weight.pt
            fi
          fi
          ls -lh model_weight.pt

      - name: 6. Run ONNX Export
        run: |
          cat << 'EOF' > export_onnx.py
          import argparse, os, sys
          import numpy as np
          sys.path.insert(0, os.path.abspath("."))
          sys.path.insert(0, os.path.abspath("networks"))

          import torch
          import torch.nn as nn
          import torch.nn.functional as F

          try:
              from networks.d2dewarp_model import D2DewarpModel
          except ImportError:
              from d2dewarp_model import D2DewarpModel

          def onnx_compatible_upsample_flow(self, flow, mask):
              N, _, H, W = flow.shape
              mask = mask.view(N, 1, 9, self.scale, self.scale, H, W)
              mask = torch.softmax(mask, dim=2)
              scaled_flow = self.scale * flow
              flow_pad = F.pad(scaled_flow, (1, 1, 1, 1))
              patches = []
              for dy in range(3):
                  for dx in range(3):
                      patches.append(flow_pad[:, :, dy : dy + H, dx : dx + W])
              up_flow = torch.stack(patches, dim=2).unsqueeze(3).unsqueeze(4)
              up_flow = torch.sum(mask * up_flow, dim=2)
              up_flow = up_flow.permute(0, 1, 4, 2, 5, 3)
              return up_flow.reshape(N, 2, self.scale * H, self.scale * W)

          class D2DewarpSingleOutput(nn.Module):
              def __init__(self, base_model):
                  super().__init__()
                  self.base_model = base_model
              def forward(self, x):
                  _, _, bm_up = self.base_model(x)
                  return bm_up

          def export():
              parser = argparse.ArgumentParser()
              parser.add_argument('--weight_path', default='model_weight.pt')
              parser.add_argument('--output_path', default='d2dewarp.onnx')
              parser.add_argument('--input_size', type=int, default=448)
              parser.add_argument('--d_model', type=int, default=448)
              parser.add_argument('--opset', type=int, default=17)
              args = parser.parse_args()

              print(f"[*] Loading PyTorch weights from {args.weight_path}...")
              try:
                  ckpt = torch.load(args.weight_path, map_location='cpu', weights_only=False)
              except Exception:
                  try:
                      torch.serialization.add_safe_globals([np.core.multiarray.scalar])
                  except Exception:
                      pass
                  ckpt = torch.load(args.weight_path, map_location='cpu')

              state_dict = ckpt.get('state_dict', ckpt)
              cleaned = {k.replace('module.', ''): v for k, v in state_dict.items()}

              base_model = D2DewarpModel(img_size=args.input_size, in_chans=4, hv_out_chans=1, d_model=args.d_model)
              base_model.load_state_dict(cleaned, strict=True)
              base_model.eval()

              import types
              base_model.dewarp_up.upsample_flow = types.MethodType(onnx_compatible_upsample_flow, base_model.dewarp_up)

              wrapper = D2DewarpSingleOutput(base_model)
              wrapper.eval()

              dummy_input = torch.randn(1, 4, args.input_size, args.input_size, dtype=torch.float32)

              print(f"[*] Exporting single-output ONNX to {args.output_path} (do_constant_folding=False)...")
              torch.onnx.export(
                  wrapper, dummy_input, args.output_path,
                  export_params=True, opset_version=args.opset,
                  do_constant_folding=False,
                  input_names=['input_rgb_edge'], output_names=['backward_mapping'],
              )
              print(f"[✓] Successfully exported {args.output_path}")

          if __name__ == '__main__':
              try:
                  export()
              except Exception:
                  import traceback
                  traceback.print_exc()
                  sys.exit(1)
          EOF

          python export_onnx.py --weight_path model_weight.pt --output_path d2dewarp.onnx
          ls -lh d2dewarp.onnx

      - name: 7. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2dewarp-onnx
          path: d2dewarp.onnx
          retention-days: 90
